<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Waleed AI — Ask Anything</title>
<style>
  :root {
    --ink: #1c2b2d;
    --paper: #f6f3ec;
    --panel: #ffffff;
    --accent: #2f6f5e;
    --accent-soft: #e4efe9;
    --user-bubble: #2f6f5e;
    --bot-bubble: #ffffff;
    --border: #d8d2c2;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    height: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 40px -20px rgba(28, 43, 45, 0.35);
  }
  header {
  background: var(--accent);
  color: white;
  padding: 18px 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
  header .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #7ee0b8; box-shadow: 0 0 0 3px rgba(126,224,184,0.25);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: 0.85; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: linear-gradient(180deg, var(--accent-soft), transparent 120px);
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--ink);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.typing { color: #8a8478; font-style: italic; }

  form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  input[type=text] {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .lang-toggle {
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    padding: 3px 9px;
    margin-left: auto;
    cursor: pointer;
    background: transparent;
  }
</style>
</head>
<body>
  <div class="card">
    <header>
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>Waleed AI</h1>
      <p>English • Hausa — AI Assistant Online</p>
    </div>
<button id="clearChat" title="Clear Chat">🗑️</button>
</header>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Type your message… / Rubuta sakonka…" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  // Point this at your deployed backend.
  const API_URL = "https://amina-ai-backend.onrender.com/api/chat";

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const clearChatBtn = document.getElementById("clearChat");

  input.focus();
  clearChatBtn.addEventListener("click", () => {
  log.innerHTML = "";
  localStorage.removeItem("chat_session_id");
  sessionId = null;

  addMessage(
    "Hi! I'm Waleed AI. Ask me anything — English or Hausa. / Sannu! Ni ne Waleed AI. Ka tambaye ni komai — Turanci ko Hausa.",
    "bot"
  );

  input.focus();
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

  let sessionId = localStorage.getItem("chat_session_id") || null;

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  addMessage("Hi! I'm Waleed AI. Ask me anything — English or Hausa. / Sannu! Ni ne Waleed AI. Ka tambaye ni komai — Turanci ko Hausa.", "bot");


  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    sendBtn.disabled = true;

    const typingEl = addMessage("Typing…", "bot typing");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, sessionId })
      });
      const data = await res.json();
      sessionId = data.sessionId;
      localStorage.setItem("chat_session_id", sessionId);

      typingEl.remove();
      addMessage(data.reply, "bot");
    } catch (err) {
      typingEl.remove();
      addMessage("Connection error. Please try again. / Matsalar hadi. Da fatan za a sake gwadawa.", "bot");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
